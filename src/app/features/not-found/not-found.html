<main
  class="relative flex min-h-[calc(100vh-5rem)] w-full items-center justify-center overflow-hidden bg-surface-light px-6 py-16 dark:bg-royal-950"
>
  <!-- Ambient glow -->
  <div class="pointer-events-none absolute inset-0 overflow-hidden">
    <div
      class="absolute top-1/2 start-1/2 h-[32rem] w-[32rem] -translate-x-1/2 -translate-y-1/2 rounded-full bg-gold-400/10 blur-3xl"
    ></div>
  </div>

  <div class="relative z-10 mx-auto max-w-2xl text-center">
    <div
      class="mx-auto mb-8 flex h-24 w-24 items-center justify-center rounded-2xl border border-gold-500/30 bg-gold-300/10 text-gold-500 shadow-lg shadow-gold-500/10 dark:bg-royal-900 dark:text-gold-400"
    >
      <i class="pi pi-compass text-4xl" aria-hidden="true"></i>
    </div>

    <p class="text-gold-gradient font-serif text-8xl font-extrabold tracking-tight sm:text-9xl">
      404
    </p>

    <h1 class="mt-4 font-serif text-3xl font-bold text-royal-950 sm:text-4xl dark:text-white">
      {{ 'notFound.title' | t }}
    </h1>
    <p class="mx-auto mt-4 max-w-md text-royal-950/60 dark:text-white/60">
      {{ 'notFound.description' | t }}
    </p>

    <div class="mt-8 flex flex-wrap items-center justify-center gap-3">
      <a pButton routerLink="/home" icon="pi pi-home">{{ 'notFound.backToHome' | t }}</a>
      <a pButton routerLink="/shop" icon="pi pi-shopping-bag" [outlined]="true">{{
        'notFound.browseShop' | t
      }}</a>
    </div>

    <div class="mt-14 border-t border-gold-500/20 pt-10">
      <p
        class="mb-5 text-sm font-medium tracking-wide text-royal-950/50 uppercase dark:text-white/50"
      >
        {{ 'notFound.popularDestinations' | t }}
      </p>
      <div class="flex flex-wrap items-center justify-center gap-3">
        @for (link of quickLinks; track link.route) {
          <a
            [routerLink]="link.route"
            class="flex items-center gap-2 rounded-full border border-gold-500/25 bg-white/40 px-4 py-2 text-sm font-medium text-royal-950/80 transition-colors hover:border-gold-500/50 hover:text-gold-600 dark:bg-white/5 dark:text-white/80 dark:hover:text-gold-400"
          >
            <i [class]="link.icon" aria-hidden="true"></i>
            {{ link.labelKey | t }}
          </a>
        }
      </div>
    </div>
  </div>
</main>
