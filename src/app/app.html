@if (loadingService.isLoading()) {
  <div class="fixed inset-x-0 top-0 z-9999 h-0.5 overflow-hidden bg-gold-500/20">
    <div class="h-full w-1/3 animate-pulse bg-gold-500"></div>
  </div>
}

<p-toast />

<div class="flex min-h-screen flex-col">
  <app-navbar />

  @if (breadcrumbService.items().length > 0) {
    <div class="mx-auto w-full max-w-7xl px-4 pt-6 sm:px-6 lg:px-8">
      <app-breadcrumb [items]="breadcrumbService.items()" />
    </div>
  }

  <router-outlet />

  <app-footer />
</div>
