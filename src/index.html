<!doctype html>
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8" />
    <title>ECommerce22</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- 🟢 Inline Blocking Anti-Flicker Script -->
    <script>
      (function () {
        try {
          var savedTheme = localStorage.getItem('app-theme');
          var prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
          if (savedTheme === 'dark' || (!savedTheme && prefersDark)) {
            document.documentElement.classList.add('my-app-dark');
          } else {
            document.documentElement.classList.remove('my-app-dark');
          }
        } catch (e) {}
      })();
    </script>

    <!-- 🟢 Inline Blocking Anti-Flicker Script (locale/direction) -->
    <script>
      (function () {
        try {
          var savedLocale = localStorage.getItem('app-locale');
          if (savedLocale !== 'en' && savedLocale !== 'ar') {
            var browserLang = (navigator.language || '').toLowerCase();
            savedLocale = browserLang.indexOf('ar') === 0 ? 'ar' : 'en';
          }
          document.documentElement.lang = savedLocale;
          document.documentElement.dir = savedLocale === 'ar' ? 'rtl' : 'ltr';
        } catch (e) {}
      })();
    </script>

    <link rel="icon" type="image/x-icon" href="/Logo.jpg" />
  </head>
  <body>
    <app-root></app-root>
  </body>
</html>
